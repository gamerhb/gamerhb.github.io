name: Build public resumes

on:
  push:
    branches: [main]
    paths:
      - "tools/build_public_resumes.py"
      - ".github/workflows/build-public-resumes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies and Arial-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-croscore
          pip install "reportlab==4.4.9" "pypdf==6.1.1"
      - name: Build curated resumes
        run: python tools/build_public_resumes.py
      - name: Validate resume PDFs
        run: |
          python - <<'PY'
          from pypdf import PdfReader

          files = {
              "finance": "Atharva_Barad_Finance_Resume.pdf",
              "analytics": "Atharva_Barad_Analytics_Resume.pdf",
              "product": "Atharva_Barad_Product_Systems_Resume.pdf",
              "operations": "Atharva_Barad_Operations_Resume.pdf",
              "consulting": "Atharva_Barad_Consulting_Strategy_Resume.pdf",
              "default": "Atharva_Barad_Resume.pdf",
          }
          for label, path in files.items():
              pdf = PdfReader(path)
              assert len(pdf.pages) == 1, f"{label} resume must be one page; got {len(pdf.pages)}"
              text = "\n".join(p.extract_text() or "" for p in pdf.pages)
              for marker in ["University of Washington Bothell", "Atharva Barad"]:
                  assert marker in text, f"{label} missing marker: {marker}"

          checks = {
              "finance": ["Monte Carlo International Expansion Research", "Costco Five-Warehouse Capital Budgeting", "Apple Fundamental Analysis"],
              "analytics": ["UniPath Student Lifecycle Platform", "CSS 475 Database Systems", "Costco Singapore Market Entry"],
              "product": ["System (formerly MasterBase)", "CommuteWise", "CSS 475 Database Systems"],
              "operations": ["N&M Events", "Business Consulting Association", "CommuteWise"],
              "consulting": ["Business Consulting Association", "WEBTOON Strategic Management Capstone", "Costco Singapore Market Entry"],
          }
          for label, markers in checks.items():
              text = "\n".join(p.extract_text() or "" for p in PdfReader(files[label]).pages)
              for marker in markers:
                  assert marker in text, f"{label} missing marker: {marker}"

          extended = PdfReader("Atharva_Barad_Extended_Profile.pdf")
          assert len(extended.pages) == 5, f"Extended profile must remain five pages; got {len(extended.pages)}"
          print("All curated resume validations passed")
          PY
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             Atharva_Barad_Finance_Resume.pdf             Atharva_Barad_Analytics_Resume.pdf             Atharva_Barad_Product_Systems_Resume.pdf             Atharva_Barad_Operations_Resume.pdf             Atharva_Barad_Consulting_Strategy_Resume.pdf             Atharva_Barad_Resume.pdf
          if git diff --cached --quiet; then
            echo "Curated resume PDFs unchanged"
          else
            git commit -m "Rebuild curated public resumes"
            git push
          fi
