name: Build public resumes

on:
  push:
    branches: [main]
    paths:
      - "tools/build_public_resumes.py"
      - ".github/workflows/build-public-resumes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: pip install "reportlab==4.4.9" "pypdf==6.1.1"
      - name: Build resumes
        run: python tools/build_public_resumes.py
      - name: Validate resume PDFs
        run: |
          python - <<'PY'
          from pypdf import PdfReader

          core = PdfReader("Atharva_Barad_Resume.pdf")
          extended = PdfReader("Atharva_Barad_Extended_Profile.pdf")

          assert len(core.pages) == 1, f"Core resume must be one page; got {len(core.pages)}"
          assert len(extended.pages) == 5, f"Extended profile must be five pages; got {len(extended.pages)}"

          core_text = "\n".join(p.extract_text() or "" for p in core.pages)
          extended_text = "\n".join(p.extract_text() or "" for p in extended.pages)

          for marker in [
              "University of Washington Bothell",
              "United Indians of All Tribes Foundation",
              "Business Consulting Association",
              "Monte Carlo International Expansion Research",
              "Costco Five-Warehouse Capital Budgeting",
              "UniPath Student Lifecycle Platform",
              "SKILLS & CREDENTIALS",
          ]:
              assert marker in core_text, f"Missing core marker: {marker}"

          for marker in [
              "Apple Fundamental Analysis",
              "Costco Singapore Market Entry",
              "WEBTOON Strategic Management Capstone",
              "System (formerly MasterBase)",
              "CommuteWise",
          ]:
              assert marker in extended_text, f"Missing extended marker: {marker}"

          print("Core pages:", len(core.pages))
          print("Extended pages:", len(extended.pages))
          print("Resume validation passed")
          PY
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Atharva_Barad_Resume.pdf Atharva_Barad_Extended_Profile.pdf
          if git diff --cached --quiet; then
            echo "Resume PDFs unchanged"
          else
            git commit -m "Rebuild public resumes from Career Hub rules"
            git push
          fi
